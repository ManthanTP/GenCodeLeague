<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer circular badge with dark gradient background -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Hammer / Gavel Graphic at 45 degree angle -->
  <g transform="rotate(-30 32 32)" filter="url(#glow)">
    <!-- Handle -->
    <rect x="29" y="24" width="6" height="26" rx="3" fill="url(#handleGrad)"/>
    <rect x="28" y="44" width="8" height="6" rx="2" fill="url(#goldGrad)"/>
    
    <!-- Metal Head Connector -->
    <rect x="27" y="20" width="10" height="5" rx="1.5" fill="url(#goldGrad)"/>
    
    <!-- Gavel Head -->
    <rect x="18" y="10" width="28" height="12" rx="3" fill="url(#hammerGrad)"/>
    <rect x="16" y="9" width="4" height="14" rx="2" fill="url(#goldGrad)"/>
    <rect x="44" y="9" width="4" height="14" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Impact stars / sparks -->
  <circle cx="48" cy="16" r="2" fill="#facc15"/>
  <circle cx="54" cy="24" r="1.5" fill="#38bdf8"/>
  <circle cx="14" cy="46" r="1.5" fill="#facc15"/>
</svg>